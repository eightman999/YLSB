name: YLSB release verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Optional branch, tag, or SHA to verify"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.target_ref || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Check out verification harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install verification dependency
        run: python -m pip install -r target/requirements-v04.txt

      - name: Run release verification
        id: verification
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python harness/tools/verify_release.py \
            --repo "$GITHUB_WORKSPACE/target" \
            --harness-repo "$GITHUB_WORKSPACE/harness" \
            --output-dir "$RUNNER_TEMP/ylsb-release-verification"
          status=$?
          echo "verify_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ylsb-release-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/ylsb-release-verification
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when verification failed
        if: always()
        shell: bash
        run: |
          status="${{ steps.verification.outputs.verify_status }}"
          if [[ -z "$status" ]]; then
            echo "verification step did not produce a status" >&2
            exit 2
          fi
          exit "$status"
